[project]
name = "gator-hacks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "An Tran", email = "antuantran233@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "loguru>=0.7.3",
    "mcp[cli]>=2.3.0",
    "openai>=3.37.0",
